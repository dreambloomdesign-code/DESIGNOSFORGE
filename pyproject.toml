[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "designosforge"
version = "2.1.0"
description = "DESIGNOSFORGE v2 source package for Codex with a mathematical design kernel, Loop Engineering, aesthetic memory, LoRA corpus planning, EnvArt CADMCP, photography, and GitHub management."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
designosforge = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["config*", "codex_skill*", "skills*", "tests*", "lora_training_sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
