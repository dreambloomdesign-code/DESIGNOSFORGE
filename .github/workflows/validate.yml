name: Validate DESIGNOSFORGE

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate source skill
        run: python tools/validate_source_skill.py

      - name: Run CLI smoke checks
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: "."
        run: |
          python -m app.cli capabilities
          python -m app.cli run "做一个品牌 VI 方案" --prompt-packet
          python -m app.cli quality audit "高级 大气 细碎 脏乱 生成一张海报"
          python -m app.cli lora init-aesthetic-space
          python -m app.cli github release-plan --version v1.5.1

      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: pytest -q
